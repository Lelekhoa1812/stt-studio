name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg for media tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check installed dependencies are consistent
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Check local launcher syntax
        run: bash -n scripts/dev.sh
      - name: Lint Python (pyflakes rules, see ruff.toml)
        run: |
          python -m pip install ruff==0.17.6
          python -m ruff check backend scripts evaluation
      - name: Run backend tests
        run: python -m pytest -rs backend/tests
      - name: Run offline evaluation tests
        run: python -m unittest discover -s evaluation/tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Typecheck frontend tests
        working-directory: frontend
        run: npm run typecheck
      - name: Install Chromium for browser tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
